backend:
  name: github
  repo: "laracesmcyl/cesmcyl-web"
  branch: main
  base_url: "https://sveltia-cms-auth.laracesmcyl.workers.dev"

media_folder: "src/static/imagenes"
public_folder: "/imagenes"

collections:
  # =====================================================================
  # PORTADA Y AJUSTES · los textos fijos de cada sección de la web
  # =====================================================================
  - name: "portada"
    label: "Portada y ajustes"
    files:
      - name: "inicio"
        label: "Titular y botones de la portada"
        file: "src/_data/inicio.json"
        fields:
          - { label: "Línea pequeña de arriba", name: "firma", widget: "string" }
          - { label: "Título · línea 1", name: "titulo_linea1", widget: "string" }
          - { label: "Título · línea 2 (en blanco)", name: "titulo_linea2", widget: "string" }
          - { label: "Título · línea 2 (en dorado)", name: "titulo_destacado2", widget: "string" }
          - { label: "Título · línea 3 (en dorado)", name: "titulo_destacado3", widget: "string" }
          - { label: "Texto", name: "lead", widget: "text" }
          - { label: "Foto de fondo", name: "imagen_fondo", widget: "image", required: false }
          - { label: "Título del tablón", name: "tablon_titulo", widget: "string", required: false }
          - { label: "Título de los documentos del tablón", name: "tablon_documentos", widget: "string", required: false }
          - { label: "Título de las noticias del tablón", name: "tablon_noticias", widget: "string", required: false }
          - label: "Botón principal"
            name: "boton_principal"
            widget: "object"
            fields:
              - { label: "Texto", name: "texto", widget: "string" }
              - { label: "Destino", name: "destino", widget: "string" }
          - label: "Botón secundario"
            name: "boton_secundario"
            widget: "object"
            fields:
              - { label: "Texto", name: "texto", widget: "string" }
              - { label: "Destino", name: "destino", widget: "string" }

  # --------------------------------------------------------- PÁGINA DE HUELGA
      - name: "aviso-urgente"
        label: "Franja de aviso de la portada"
        file: "src/static/aviso-urgente.json"
        fields:
          - { label: "Mostrar el aviso", name: "activo", widget: "boolean", default: false }
          - { label: "Mensaje del aviso", name: "texto", widget: "markdown", required: false, hint: "Con los botones de arriba pones negrita, cursiva, subrayado y enlaces." }
          - label: "Alineación del mensaje"
            name: "alineacion"
            widget: "select"
            required: false
            default: "izquierda"
            options:
              - { label: "A la izquierda", value: "izquierda" }
              - { label: "Centrado", value: "centro" }
              - { label: "A la derecha", value: "derecha" }

  # --------------------------------------------------------------- NOTICIAS
      - name: "quienes"
        label: "Sección «Quiénes somos»"
        file: "src/_data/quienes.json"
        fields:
          - { label: "Título", name: "titulo", widget: "string" }
          - { label: "Introducción", name: "intro", widget: "text", hint: "Puedes poner **negritas** con dos asteriscos a cada lado." }
          - { label: "Lema", name: "lema", widget: "string", required: false }
          - { label: "Título de la lista", name: "titulo_objetivos", widget: "string", required: false, default: "Nuestros objetivos" }
          - label: "Objetivos"
            name: "objetivos"
            widget: "list"
            label_singular: "Objetivo"
            summary: "{{fields.texto}}"
            fields:
              - { label: "Texto", name: "texto", widget: "text" }

  # --------------------------------------------------------------- SERVICIOS
      - name: "servicios-portada"
        label: "Sección «Servicios» de la portada"
        file: "src/_data/servicios.json"
        fields:
          - { label: "Título", name: "titulo", widget: "string" }
          - { label: "Introducción", name: "intro", widget: "text" }
      - name: "noticias-portada"
        label: "Sección «Noticias» de la portada"
        file: "src/_data/noticias.json"
        fields:
          - { label: "Título", name: "titulo", widget: "string" }
          - { label: "Frase debajo del título", name: "intro", widget: "text" }
          - { label: "Texto del botón «ver más»", name: "boton", widget: "string" }
          - { label: "Texto del buscador", name: "buscador", widget: "string" }

      - name: "afiliate"
        label: "Página «Afíliate»"
        file: "src/_data/afiliate.json"
        fields:
          - { label: "Título", name: "titulo", widget: "string" }
          - { label: "Introducción", name: "intro", widget: "text" }
          - { label: "Título de los pasos", name: "titulo_pasos", widget: "string" }
          - label: "Pasos"
            name: "pasos"
            widget: "list"
            label_singular: "Paso"
            summary: "{{fields.titulo}}"
            fields:
              - { label: "Título del paso", name: "titulo", widget: "string" }
              - { label: "Texto", name: "texto", widget: "text" }
              - { label: "Texto del botón de descarga", name: "boton", widget: "string", required: false, hint: "Solo en el primer paso." }
              - { label: "Frase antes de la dirección postal", name: "texto_postal", widget: "string", required: false }
              - { label: "Dirección postal", name: "direccion_postal", widget: "text", required: false, hint: "Si lo rellenas, en este paso salen el correo y la dirección." }
          - { label: "Frase de dudas", name: "dudas", widget: "string" }
          - { label: "Hoja de afiliación (PDF)", name: "documento", widget: "file" }
          - { label: "Nombre del documento", name: "titulo_documento", widget: "string" }

      - name: "pie"
        label: "Pie de página"
        file: "src/_data/pie.json"
        fields:
          - { label: "Descripción del sindicato", name: "descripcion", widget: "text" }
          - { label: "Título de la primera columna", name: "titulo_columna1", widget: "string" }
          - label: "Enlaces de la primera columna"
            name: "enlaces_columna1"
            widget: "list"
            label_singular: "Enlace"
            summary: "{{fields.texto}}"
            fields:
              - { label: "Texto", name: "texto", widget: "string" }
              - { label: "Destino", name: "destino", widget: "string" }
          - { label: "Título de la columna de servicios", name: "titulo_servicios", widget: "string" }
          - { label: "Título de la columna de contacto", name: "titulo_contacto", widget: "string" }
          - { label: "Línea de copyright", name: "copyright", widget: "string", hint: "El año se pone solo delante." }
          - label: "Enlaces legales de la barra de abajo"
            name: "enlaces_legales"
            widget: "list"
            label_singular: "Enlace"
            summary: "{{fields.texto}}"
            fields:
              - { label: "Texto", name: "texto", widget: "string" }
              - { label: "Destino", name: "destino", widget: "string" }

      - name: "tarifas"
        label: "Tarifas de asesoría jurídica"
        file: "src/_data/tarifas.json"
        fields:
          - { label: "Título", name: "titulo", widget: "string" }
          - { label: "Introducción", name: "intro", widget: "text" }
          - { label: "Pregunta del selector", name: "etiqueta_selector", widget: "string" }
          - { label: "Cabecera de la primera columna", name: "columna_servicio", widget: "string" }
          - { label: "Cabecera de la columna de referencia", name: "columna_referencia", widget: "string" }
          - { label: "Palabra para lo gratuito", name: "texto_gratis", widget: "string", hint: "Las casillas con esta palabra se pintan en verde." }
          - label: "Tramos de antigüedad"
            name: "tramos"
            widget: "list"
            label_singular: "Tramo"
            summary: "{{fields.nombre}}"
            fields:
              - { label: "Nombre", name: "nombre", widget: "string" }
              - { label: "Nombre corto (cabecera de la tabla)", name: "corto", widget: "string", required: false }
              - { label: "Descuento", name: "nota", widget: "string", required: false }
          - label: "Filas de la tabla"
            name: "filas"
            widget: "list"
            label_singular: "Servicio"
            summary: "{{fields.servicio}}"
            fields:
              - { label: "Servicio", name: "servicio", widget: "string" }
              - { label: "Precio de referencia", name: "referencia", widget: "string" }
              - label: "Precios por tramo"
                name: "precios"
                widget: "list"
                field: { label: "Precio", name: "precio", widget: "string" }
                hint: "Un precio por cada tramo y en el mismo orden."
          - label: "Bloques de información"
            name: "bloques"
            widget: "list"
            label_singular: "Bloque"
            summary: "{{fields.titulo}}"
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Texto", name: "texto", widget: "text", required: false }
              - label: "Lista de puntos"
                name: "puntos"
                widget: "list"
                required: false
                summary: "{{fields.texto}}"
                fields:
                  - { label: "Texto", name: "texto", widget: "string" }
          - label: "Forma de pago"
            name: "pago"
            widget: "object"
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Texto", name: "texto", widget: "text" }
              - { label: "IBAN", name: "iban", widget: "string", required: false }
              - { label: "Nota del concepto", name: "concepto", widget: "string", required: false }

      - name: "textos"
        label: "Rótulos del menú y del formulario"
        file: "src/_data/textos.json"
        fields:
          - { label: "Menú · Inicio", name: "menu_inicio", widget: "string" }
          - { label: "Menú · Noticias", name: "menu_noticias", widget: "string" }
          - { label: "Menú · Quiénes somos", name: "menu_quienes", widget: "string" }
          - { label: "Menú · Servicios", name: "menu_servicios", widget: "string" }
          - { label: "Menú · Contacto", name: "menu_contacto", widget: "string" }
          - { label: "Menú · Botón Afíliate", name: "menu_afiliate", widget: "string" }
          - { label: "Barra de arriba · Campus", name: "topbar_campus", widget: "string" }
          - { label: "Barra de arriba · Enlace del campus", name: "campus_destino", widget: "string" }
          - { label: "Barra de arriba · Acceso al panel", name: "topbar_admin", widget: "string" }
          - { label: "Servicios · Título de las noticias", name: "serv_noticias", widget: "string" }
          - { label: "Servicios · Título de las páginas hermanas", name: "serv_hermanas", widget: "string" }
          - { label: "Servicios · Título del recuadro de enlaces", name: "serv_enlaces", widget: "string" }
          - { label: "Servicios · Enlaces que se ven sin desplegar", name: "serv_enlaces_visibles", widget: "number", value_type: "int", hint: "A partir de este número aparece el botón «Ver todos los enlaces»." }
          - { label: "Servicios · Texto del botón de ver todos", name: "serv_enlaces_boton", widget: "string" }
          - { label: "Servicios · Texto del botón de ver menos", name: "serv_enlaces_boton_menos", widget: "string" }
          - { label: "Servicios · Enlace «ver todas»", name: "serv_ver_todas", widget: "string" }
          - { label: "Servicios · Aviso de apartado sin noticias", name: "serv_vacio", widget: "string" }
          - { label: "Formulario · Nombre", name: "form_nombre", widget: "string" }
          - { label: "Formulario · Apellidos", name: "form_apellidos", widget: "string" }
          - { label: "Formulario · Correo", name: "form_email", widget: "string" }
          - { label: "Formulario · Teléfono", name: "form_telefono", widget: "string" }
          - { label: "Formulario · Provincia", name: "form_provincia", widget: "string" }
          - { label: "Formulario · Mensaje", name: "form_mensaje", widget: "string" }
          - { label: "Formulario · Texto de ayuda del mensaje", name: "form_mensaje_ayuda", widget: "string" }
          - { label: "Formulario · Casilla de privacidad", name: "form_privacidad", widget: "text" }
          - { label: "Formulario · Botón de enviar", name: "form_boton", widget: "string" }

      - name: "diseno"
        label: "Diseño de la web"
        file: "src/_data/diseno.json"
        fields:
          - label: "Colores"
            name: "colores"
            widget: "object"
            fields:
              - { label: "Verde principal", name: "verde", widget: "color", hint: "El de los fondos oscuros y los títulos." }
              - { label: "Verde oscuro", name: "verde_hondo", widget: "color" }
              - { label: "Verde suave", name: "verde_medio", widget: "color" }
              - { label: "Dorado", name: "oro", widget: "color", hint: "Botones y detalles." }
              - { label: "Dorado claro", name: "oro_claro", widget: "color" }
              - { label: "Fondo claro", name: "papel", widget: "color", hint: "El verde muy claro de algunas secciones." }
              - { label: "Color del texto", name: "tinta", widget: "color" }
          - label: "Tipografía"
            name: "tipografia"
            widget: "object"
            fields:
              - label: "Fuente"
                name: "fuente"
                widget: "select"
                options: ["Lato", "Inter", "Open Sans", "Source Sans 3", "Nunito Sans", "Roboto", "Montserrat", "Work Sans", "Merriweather Sans"]
                hint: "Se aplica a toda la web."
              - { label: "Tamaño del texto (px)", name: "tamano_base", widget: "number", value_type: "int", min: 14, max: 20, hint: "17 es lo normal. Súbelo para que se lea más grande en toda la web." }
          - label: "Formas"
            name: "formas"
            widget: "object"
            fields:
              - { label: "Redondeo de las tarjetas (px)", name: "radio_tarjetas", widget: "number", value_type: "int", min: 0, max: 30, hint: "0 = esquinas rectas." }
              - { label: "Redondeo de los botones (px)", name: "radio_botones", widget: "number", value_type: "int", min: 0, max: 30 }
              - { label: "Margen lateral de la web (%)", name: "ancho_lateral", widget: "number", value_type: "float", min: 1, max: 10, step: 0.5, hint: "Cuánto aire queda a los lados. 3.5 es lo actual." }
          - label: "Franja de aviso"
            name: "aviso"
            widget: "object"
            fields:
              - { label: "Color de fondo", name: "fondo", widget: "color" }
              - { label: "Color del texto", name: "texto", widget: "color" }
              - { label: "Tamaño de la letra", name: "tamano", widget: "number", value_type: "float", min: 0.7, max: 1.6, step: 0.02, hint: "0.92 es lo normal. 1.2 se ve bastante más grande." }

          - label: "Orden de las secciones de la portada"
            name: "secciones"
            widget: "list"
            label_singular: "Sección"
            hint: "Arrastra para cambiar el orden. Si quitas una, deja de verse en la portada."
            field:
              label: "Sección"
              name: "seccion"
              widget: "select"
              options:
                - { label: "Primera pantalla y tablón", value: "inicio" }
                - { label: "Noticias", value: "noticias" }
                - { label: "Quiénes somos", value: "quienes" }
                - { label: "Servicios", value: "servicios" }
                - { label: "Contacto", value: "contacto" }

      - name: "contacto"
        label: "Datos de contacto y redes"
        file: "src/_data/contacto.json"
        fields:
          - { label: "Título", name: "titulo", widget: "string" }
          - { label: "Introducción", name: "intro", widget: "text" }
          - { label: "Teléfono (como se ve)", name: "telefono", widget: "string" }
          - { label: "Teléfono (para llamar)", name: "telefono_enlace", widget: "string", hint: "Con prefijo y sin espacios: +34983218524" }
          - { label: "Correo electrónico", name: "email", widget: "string" }
          - { label: "Dirección", name: "direccion", widget: "text" }
          - { label: "Horario", name: "horario", widget: "string" }
          - { label: "Web de CESM Castilla y León", name: "web_cesmcyl", widget: "string" }
          - { label: "Título del bloque de redes", name: "titulo_redes", widget: "string", required: false }
          - { label: "Texto del bloque de redes", name: "texto_redes", widget: "text", required: false }
          - { label: "Título del formulario", name: "titulo_formulario", widget: "string", required: false }
          - label: "Redes sociales"
            name: "redes"
            widget: "object"
            fields:
              - { label: "Instagram", name: "instagram", widget: "string", required: false }
              - { label: "Facebook", name: "facebook", widget: "string", required: false }
              - { label: "TikTok", name: "tiktok", widget: "string", required: false }
              - { label: "X", name: "x", widget: "string", required: false }
              - { label: "YouTube", name: "youtube", widget: "string", required: false }

  # -------------------------------------------------------------------- INICIO
      - name: "huelga-info"
        label: "Texto de la página de huelga"
        file: "src/static/huelga-info.json"
        fields:
          - { label: "Texto", name: "texto", widget: "markdown", required: false }

  # ------------------------------------------------------------- CATEGORÍAS
      - name: "categorias"
        label: "Lista de categorías"
        file: "src/static/categorias.json"
        fields:
          - label: "Categorías"
            name: "categorias"
            widget: "list"
            label_singular: "Categoría"
            summary: "{{fields.nombre}}"
            hint: "Para crear un subapartado, escribe «Grupo / Nombre». Ejemplo: «Novedades Normativas / Autonómicas» o «OPEs y Concursos de Traslados / Tutores». Aparecerá solo como pestaña nueva en su página."
            fields:
              - { label: "Nombre", name: "nombre", widget: "string" }

  - name: "noticias"
    label: "Noticias"
    label_singular: "Noticia"
    folder: "src/noticias"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    summary: "{{date}}  ·  {{category}}  ·  {{title}}"
    sortable_fields: ["date", "title", "category"]
    view_groups:
      - label: "Categoría"
        field: category
      - label: "Año"
        field: date
        pattern: "\\d{4}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - label: "Fecha"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        picker_utc: true
      - label: "Categoría"
        name: "category"
        widget: "relation"
        collection: "portada"
        file: "categorias"
        value_field: "categorias.*.nombre"
        display_fields: ["categorias.*.nombre"]
        search_fields: ["categorias.*.nombre"]
        required: false
        hint: "Si eliges «Huelga», la noticia aparece además en la página de huelga."
      - { label: "Imagen (opcional)", name: "image", widget: "image", required: false }
      - { label: "Resumen corto (opcional)", name: "description", widget: "string", required: false }
      - { label: "Cuerpo de la noticia", name: "body", widget: "markdown" }

  # ----------------------------------------------------------------- TABLÓN

  - name: "servicios"
    label: "Servicios"
    label_singular: "Página de servicio"
    folder: "src/servicios"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    summary: "{{orden}}. {{title}}"
    sortable_fields: ["orden", "title"]
    media_folder: "/src/static/documentos"
    public_folder: "/documentos"
    fields:
      - { label: "Título de la página", name: "title", widget: "string" }
      - { label: "Nombre en el menú", name: "menu", widget: "string", required: false, hint: "Más corto que el título. Si lo dejas vacío, se usa el título." }
      - { label: "Entradilla", name: "entradilla", widget: "text", required: false, hint: "La frase que sale bajo el título y en la tarjeta de la portada." }
      - label: "Icono"
        name: "icono"
        widget: "select"
        options: ["brujula", "documento", "maletin", "corazon", "libro", "balanza", "escudo", "personas", "info"]
        default: "info"
      - { label: "Orden en el menú", name: "orden", widget: "number", default: 1, value_type: "int", min: 1 }
      - label: "¿Va dentro de otro servicio?"
        name: "padre"
        widget: "relation"
        collection: "servicios"
        value_field: "{{slug}}"
        display_fields: ["title"]
        search_fields: ["title"]
        required: false
        hint: "Déjalo vacío para que aparezca en el menú Servicios. Si eliges uno, esta página queda DENTRO de él y no sale en el menú."
      - label: "Noticias que se muestran"
        name: "categorias"
        widget: "list"
        required: false
        field:
          label: "Categoría"
          name: "categoria"
          widget: "relation"
          collection: "portada"
          file: "categorias"
          value_field: "categorias.*.nombre"
          display_fields: ["categorias.*.nombre"]
          search_fields: ["categorias.*.nombre"]
        hint: "Las noticias de estas categorías aparecen solas en la página, de la más reciente a la más antigua."
      - label: "Subapartados (pestañas)"
        name: "subapartados"
        widget: "string"
        required: false
        hint: "Escribe el nombre de un grupo de categorías (por ejemplo «Novedades Normativas» u «OPEs y Concursos de Traslados»). La página mostrará una pestaña por cada categoría «Grupo / Nombre» de la lista de categorías."
      - label: "Bloques de enlaces y documentos"
        name: "bloques"
        widget: "list"
        required: false
        label_singular: "Bloque"
        summary: "{{fields.titulo}}"
        fields:
          - { label: "Título del bloque", name: "titulo", widget: "string", hint: "Por ejemplo: Enlaces útiles, MIR, CESMCYL." }
          - label: "Enlaces"
            name: "enlaces"
            widget: "list"
            label_singular: "Enlace"
            summary: "{{fields.texto}}"
            fields:
              - { label: "Texto", name: "texto", widget: "string" }
              - { label: "Descripción (opcional)", name: "descripcion", widget: "string", required: false }
              - { label: "Documento", name: "archivo", widget: "file", required: false }
              - { label: "O destino", name: "destino", widget: "string", required: false, hint: "Una dirección de fuera (https://…) o una página de la web (/huelga/)." }
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "tablon"
    label: "Tablón (portada)"
    label_singular: "Destacado"
    folder: "src/tablon"
    create: true
    slug: "{{fields.orden}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    summary: "{{orden}}. {{title}}  ·  {{category}}"
    sortable_fields: ["orden", "title", "category"]
    media_folder: "/src/static/documentos"
    public_folder: "/documentos"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - label: "Categoría"
        name: "category"
        widget: "relation"
        collection: "portada"
        file: "categorias"
        value_field: "categorias.*.nombre"
        display_fields: ["categorias.*.nombre"]
        search_fields: ["categorias.*.nombre"]
        required: false
        hint: "Es la pastilla dorada de la tarjeta y agrupa las pestañas del tablón."
      - { label: "Descripción corta (opcional)", name: "descripcion", widget: "string", required: false }
      - label: "Documento para descargar"
        name: "archivo"
        widget: "file"
        required: false
        hint: "PDF, Word, Excel… Si subes un documento, manda este y se ignora el enlace."
      - { label: "O enlace a otra web", name: "enlace", widget: "string", required: false }
      - { label: "Texto del botón", name: "texto_boton", widget: "string", required: false, default: "Descargar" }
      - { label: "Mostrar también en la página de huelga", name: "en_huelga", widget: "boolean", default: false }
      - { label: "Mostrar también en «Nuestras redes»", name: "en_redes", widget: "boolean", default: false }
      - { label: "Imagen (solo para «Nuestras redes»)", name: "imagen", widget: "image", required: false }
      - { label: "Orden", name: "orden", widget: "number", default: 1, value_type: "int", min: 1, hint: "1 es el primero." }

  # ----------------------------------------------------------------- PÁGINAS

  - name: "paginas"
    label: "Páginas"
    label_singular: "Página"
    folder: "src/paginas"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    summary: "{{title}}   /{{slug}}/"
    media_folder: "/src/static/documentos"
    public_folder: "/documentos"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Entradilla (el texto bajo el título)", name: "entradilla", widget: "text", required: false }
      - label: "¿Va dentro de un servicio?"
        name: "padre"
        widget: "relation"
        collection: "servicios"
        value_field: "{{slug}}"
        display_fields: ["title"]
        search_fields: ["title"]
        required: false
        hint: "Si eliges uno, esta página aparece como apartado dentro de él, igual que OPEs dentro de Información y orientación laboral."
      - { label: "Nombre corto (para el menú)", name: "menu", widget: "string", required: false }
      - { label: "Orden dentro del servicio", name: "orden", widget: "number", required: false, value_type: "int" }
      - label: "Icono"
        name: "icono"
        widget: "select"
        required: false
        options: ["documento", "maletin", "libro", "corazon", "escudo", "balanza", "info", "brujula", "personas"]
      - { label: "Texto de la miga de pan", name: "migas", widget: "string", required: false, default: "Inicio", hint: "Solo si la página no va dentro de un servicio." }
      - { label: "A dónde vuelve la miga de pan", name: "migas_destino", widget: "string", required: false, default: "/" }
      - { label: "Contenido", name: "body", widget: "markdown" }
      - { label: "Título de la columna de documentos", name: "titulo_documentos", widget: "string", required: false, default: "Documentos y enlaces" }
      - label: "Documentos y enlaces de la página"
        name: "documentos"
        widget: "list"
        required: false
        label_singular: "Documento o enlace"
        summary: "{{fields.texto}}"
        fields:
          - { label: "Texto", name: "texto", widget: "string" }
          - { label: "Descripción (opcional)", name: "descripcion", widget: "string", required: false }
          - { label: "Documento", name: "archivo", widget: "file", required: false }
          - { label: "O enlace", name: "enlace", widget: "string", required: false }

  # ----------------------------------------------------------- QUIÉNES SOMOS
